[package]
name = "sonora-desktop"
version = "0.1.0"
description = "SONORA local audio workstation for Windows"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "sonora"
path = "src/main.rs"

[[bin]]
name = "sonora-harmony"
path = "src/main.rs"

[[bin]]
name = "sonora-specialist"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
rand = "=0.9.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
