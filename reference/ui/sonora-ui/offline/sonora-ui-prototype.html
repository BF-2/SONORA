<dialog id="modal"><div id="modalContent"></div></dialog>
<script>
'use strict';

// SONORA is an interaction prototype. Audio decoding, playback, trim/gain export,
// recipe persistence and synthetic stem mixing run locally. No AI model is loaded.
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const time = v => `${String(Math.floor(Math.max(0,v)/60)).padStart(2,'0')}:${Math.max(0,v%60).toFixed(1).padStart(4,'0')}`;
const steps = [
  ['导入与诊断','in','从一条原始音频开始。','先确定想做什么，其他交给合适的流程。'],
  ['人声整理','layers','让主唱，清晰地站出来。','保留伴奏和和声，给后面的音高与换声一个干净起点。'],
  ['音高与歌词','note','保留表达，修好每一处。','先听见问题，再决定修多少。你的手动编辑始终保留。'],
  ['声音转换','spark','一段声音，多种可能。','先试听最难的一句，再决定整首的声音。'],
  ['混音与后期','sliders','把声音，放回音乐里。','在同一时间线上，让主唱、和声和伴奏重新融为一体。'],
  ['检查与导出','out','最后一遍，为好声音把关。','保留工程、分轨和制作配方，让下一次调整更轻松。']
];
const modelNames={clear:'清澈 · 女声',warm:'温暖 · 男声',air:'空灵 · 参考音色'};
const algorithms=[['RMVPE','音乐人声首选候选'],['FCPE','快速试听候选'],['CREPE','疑难片段复核'],['Harvest','传统算法备用'],['DIO + StoneMask','CPU 备用路径'],['pYIN','单声部离线基线']];
const presets={natural:{name:'自然翻唱',shift:0,correction:28,vibrato:85,indexRate:50,protect:33},high:{name:'高音优先',shift:-2,correction:40,vibrato:80,indexRate:35,protect:40},soft:{name:'保留气声',shift:0,correction:15,vibrato:95,indexRate:30,protect:45},speech:{name:'清晰口播',shift:0,correction:0,vibrato:100,indexRate:50,protect:40}};
const newState=()=>({schema:'sonora.prototype.recipe.v1',step:0,mode:'guided',task:'cover',source:{id:'demo-v1',name:'夜航 · 合成示例',kind:'demo',duration:24,sampleRate:32000,channels:2,peak:null},preset:'natural',model:'clear',alg:'RMVPE',shift:0,correction:28,vibrato:85,indexRate:50,protect:33,formant:0,denoise:18,smoothing:12,selection:[12,16],pitchEdits:{},curveEdits:{},pitchFixed:false,pitchLocked:false,snap:true,tool:'select',pitchTab:'pitch',harmony:'keep',lyricsRoute:'guide',lyrics:['把晚风轻轻写进歌里','让星光慢慢落在这里','这一刻有你陪着我远行'],mix:{source:0,lead:0,harmony:-6,music:-3,master:-1},mute:{},solo:null,loop:false,post:{eq:true,compress:true,deess:false,reverb:true,limiter:true},reverb:14,versions:[{id:'v01',label:'自然 · 初稿',model:'clear',alg:'RMVPE',indexRate:50,shift:0,source:'clean',type:'demo'},{id:'v02',label:'高音 · 保护',model:'warm',alg:'CREPE',indexRate:35,shift:-2,source:'clean',type:'demo'}],selectedVersion:'v01',serial:false,format:'wav',bitDepth:'24',exportRate:'48000',exportStems:true,exportRecipe:true,exportRange:'all',jobs:[]});
let state=newState(),undoStack=[],activePanel=null,toastTimer,jobTimer=null,audioCtx=null,decoded=null,demoStems=null,audioSources=[],gainNodes={},masterGain=null,startedAt=0,offset=0,isPlaying=false,listen='A',raf=0,drag=null,playEpoch=0,loadEpoch=0,starting=false;
const audioCache=new Map();
let originalLyrics=['把晚风轻轻写进歌里','让星光慢慢落在这里','这一刻有你陪着我远行'];
try{const saved=JSON.parse(localStorage.getItem('sonora-settings')||'null');if(saved?.schema===state.schema){state.mode=saved.mode==='pro'?'pro':'guided';state.preset=presets[saved.preset]?saved.preset:'natural';}}catch{}
const persistSettings=()=>{try{localStorage.setItem('sonora-settings',JSON.stringify({schema:state.schema,mode:state.mode,preset:state.preset}));}catch{}};
function snapshot(){undoStack.push(JSON.stringify(state));if(undoStack.length>45)undoStack.shift();}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3900);}
function badge(text,cls='neutral'){return `<span class="badge ${cls}"><span class="pill-dot"></span>${esc(text)}</span>`;}
function header(step=state.step){let s=steps[step];return `<div class="page-head"><div><div class="eyebrow">${String(step+1).padStart(2,'0')} / THE CREATIVE PROCESS</div><h1>${s[2]}</h1><p class="page-subtitle">${s[3]}</p></div><div class="page-head-right">${badge(state.source.kind==='demo'?'演示工程':state.source.kind==='unlinked'?'待重新链接':'本地音频',state.source.kind==='demo'?'orange':'blue')}<button class="quiet-button" data-act="about">${icon('info')}能力说明</button></div></div>`;}
function footer(){return `<div class="page-bottom"><span class="bottom-note">${icon('save')}原始素材保留 · 配方可独立保存</span><div class="bottom-actions">${state.step>0?`<button class="button ghost" data-act="prev">${icon('back')}上一步</button>`:''}${state.step<5?`<button class="button primary" data-act="next">${state.mode==='guided'?'下一步：':''}${steps[state.step+1][0]}${icon('arrow')}</button>`:`<button class="button primary" data-act="saveRecipe">${icon('save')}保存完整配方</button>`}</div></div>`;}
function mockNote(text='AI 分离、音高曲线和模型转换为交互演示；未接入推理引擎。'){return `<div class="mock-banner">${icon('info')}${text}</div>`;}
function fieldSelect(id,label,opts,value,help=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-field="${id}">${opts.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}</select>${help?`<small>${help}</small>`:''}</div>`;}
function slider(id,label,min,max,val,suffix='',help=''){return `<div class="field"><label for="${id}">${label}<span class="value" id="${id}Value">${val}${suffix}</span></label><input type="range" id="${id}" data-range="${id}" min="${min}" max="${max}" value="${val}" data-suffix="${suffix}" aria-label="${label}">${help?`<small>${help}</small>`:''}</div>`;}
function toggle(key,label,on,help=''){return `<div class="toggle-row"><span class="switch-label">${label}${help?`<small>${help}</small>`:''}</span><button class="toggle ${on?'on':''}" data-toggle="${key}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;}
function sourceWave(tracks=['source']){const infos={source:['原始音频','完整素材',''],lead:['主唱','人声轨',''],harmony:['和声','独立保留','purple'],music:['伴奏','立体声','blue']};return `<div class="wave-editor"><div class="wave-ruler">${[0,.25,.5,.75,1].map(n=>`<span>${time(n*state.source.duration)}</span>`).join('')}</div>${tracks.map((t,i)=>`<div class="track"><div class="track-label">${infos[t][0]}<small>${infos[t][1]}</small>${t!=='source'?`<div class="track-actions"><button data-mute="${t}" class="${state.mute[t]?'active':''}" aria-label="${infos[t][0]}静音">M</button><button data-solo="${t}" class="${state.solo===t?'active':''}" aria-label="${infos[t][0]}独奏">S</button></div>`:''}</div><div class="wave-canvas-wrap ${infos[t][2]}"><canvas class="wave" data-track="${t}" data-index="${i}" aria-label="${infos[t][0]}波形，拖动选择时间范围"></canvas><span class="wave-label">${state.source.kind==='demo'?'SYNTHETIC DEMO':state.source.kind==='unlinked'?'等待重新链接':t==='source'?'LOCAL AUDIO':'等待分离引擎'}</span></div></div>`).join('')}</div>`;}
function modelInspector(){return `<aside class="inspector stack"><div class="card card-pad"><p class="summary-label">这次想要的声音</p><div class="selected-model"><div class="avatar ${state.model==='warm'?'orange':''}">${icon('wave')}</div><div><strong>${modelNames[state.model]}</strong><small>模型卡演示 · 尚未载入权重</small></div></div>${fieldSelect('model','目标音色',[['clear','清澈 · 女声 / RVC'],['warm','温暖 · 男声 / RVC'],['air','空灵 · 参考音色 / 可选引擎']],state.model)}${fieldSelect('preset','制作预设',Object.entries(presets).map(([k,v])=>[k,v.name]),state.preset,'预设是起点。每个参数都可以继续调整。')}<div class="line"></div><div class="parameter-row"><span>音高处理</span><strong>自动建议 → 人工确认</strong></div><div class="parameter-row"><span>和声策略</span><strong>${state.harmony==='keep'?'保留原和声':'单独处理'}</strong></div><div class="parameter-row"><span>候选策略</span><strong>同源 · 分支生成</strong></div><button class="button full space-top" data-panel="models">${icon('box')}查看模型兼容能力</button></div><div class="helper-box"><strong>不用先学会所有参数。</strong><p>先完成一次短片段试听；只有需要时，再展开「精细编辑」。</p></div></aside>`;}
function renderImport(){const measured=state.source.kind==='local'&&!!decoded,unlinked=state.source.kind==='unlinked';return `${header()}<div class="layout-split"><div class="stack"><div class="card card-pad"><div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="导入音频或拖入文件"><div class="drop-icon">${icon('in')}</div><div><h2>${measured||unlinked?esc(state.source.name):'把你的音频，放到这里。'}</h2><p>支持浏览器可解码的 WAV / MP3 / FLAC / M4A 等 · 文件不上传</p><div class="file-actions"><button class="button primary small" data-act="import">选择音频</button><button class="text-button" data-act="demo">体验示例工程 ${icon('arrow')}</button></div></div></div><div class="section-caption">你想完成什么？<span>可以随时切换</span></div><div class="task-grid">${[['cover','note','歌曲翻唱','原词 · 换一种音色'],['speech','mic','语音变声','对话 · 口播 · 配音'],['lyrics','spark','改词翻唱','新歌词 · 原旋律'],['realtime','headphones','实时变声','麦克风 · 即时监听']].map(([k,i,t,d])=>`<button class="task-card ${state.task===k?'active':''}" data-task="${k}">${icon(i)}<strong>${t}</strong><small>${d}</small></button>`).join('')}</div></div><div class="card"><div class="card-top"><h2 class="card-title">${icon('wave')}素材速览</h2><span class="mini-note">${unlinked?'等待重新链接 · 元数据来自配方':measured?'浏览器解码测量':'示例数据 · 非 AI 检测结果'}</span></div><div style="padding:0 20px"><div class="mini-stats"><div class="stat"><span>音频长度</span><strong>${time(state.source.duration)}</strong></div><div class="stat"><span>解码采样率 / 声道</span><strong>${(state.source.sampleRate/1000).toFixed(1)}<small>kHz / ${state.source.channels}</small></strong></div><div class="stat"><span>${unlinked?'音频状态':measured?'采样峰值':'示例场景'}</span><strong>${unlinked?'待重新链接':measured?(state.source.peak===null?'待检测':state.source.peak<=0?'−∞ dBFS':(20*Math.log10(state.source.peak)).toFixed(1)+' dBFS'):'主唱 + 和声'}</strong></div></div></div>${sourceWave()}<div class="issue-list">${unlinked?`<div class="issue-item"><span class="issue-index">!</span><div class="issue-text"><strong>配方已恢复，请重新链接原始音频</strong><small>这里还没有音频字节，不能播放、测量或导出。重新选择文件后保留编辑。</small></div></div>`:measured?`<div class="issue-item"><span class="issue-index">i</span><div class="issue-text"><strong>已读取文件，可以真实播放与裁剪</strong><small>未执行分离、音高或歌词识别。下面的 AI 编辑页面仍为独立演示。</small></div></div>${state.source.peak>=.999?'<div class="issue-item"><span class="issue-index">!</span><div class="issue-text"><strong>采样值接近满幅</strong><small>建议检查是否削波；只凭峰值不能确定已发生削波。</small></div></div>':''}`:`<div class="issue-item"><span class="issue-index">1</span><div class="issue-text"><strong>副歌的主唱与和声重叠</strong><small>00:12–00:16 · 先整理声部，再检查音高跳动</small></div><button class="text-button" data-act="listenRisk">听听这里 ${icon('play')}</button></div><div class="issue-item"><span class="issue-index">2</span><div class="issue-text"><strong>长音的颤音值得保留</strong><small>建议轻修音准，保留音高曲线中的自然起伏</small></div><button class="text-button" data-act="pitch">查看音高 ${icon('arrow')}</button></div>`}</div></div></div>${modelInspector()}</div>${footer()}`;}
function renderArrange(){return `${header()}${mockNote(state.source.kind==='demo'?'示例的主唱、和声与伴奏由程序分别合成，可真实静音/独奏；并非 AI 分离结果。':'已导入音频只播放原轨。下面分轨为待执行状态，原型不会伪造分离结果。')}<div class="layout-split"><div class="stack"><div class="card"><div class="card-top"><h2 class="card-title">${icon('layers')}分开处理，保留每一层</h2>${badge('非破坏编辑')}</div>${sourceWave(state.source.kind==='demo'?['lead','harmony','music']:['source'])}<div class="segment-band">选区 <strong id="selectionText">${time(state.selection[0])} — ${time(state.selection[1])}</strong><span>· 在波形上拖动裁剪范围</span></div></div><div class="card card-pad"><div class="field-grid"><div class="field"><label for="trimStart">选区起点（秒）</label><input type="number" id="trimStart" min="0" step="0.1" max="${state.source.duration}" value="${state.selection[0].toFixed(1)}"></div><div class="field"><label for="trimEnd">选区终点（秒）</label><input type="number" id="trimEnd" min="0" step="0.1" max="${state.source.duration}" value="${state.selection[1].toFixed(1)}"></div></div><div class="row space-top wrap"><button class="button small" data-act="playSelection">${icon('play')}循环试听选区</button><button class="button ghost small" data-act="resetSelection">选择整段</button><button class="button ghost small" data-act="simulateSeparation">${icon('layers')}演示分离任务</button></div></div><div class="risk-card"><span class="risk-icon">!</span><div><h3>和声是一条独立的旋律。</h3><p>当两个声部叠在一起，音高可能在两条旋律之间跳动。先听主唱是否足够干净，再决定要不要换算法或修曲线。</p><button class="button orange small" data-act="pitch">前往音高检查 ${icon('arrow')}</button></div></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>人声整理</strong><span class="subtle-label">SELECTED CLIP</span></div>${fieldSelect('harmony','和声怎么处理',[['keep','保留原和声'],['convert','主唱与和声分别换声'],['lower','降低和声存在感']],state.harmony)}${slider('denoise','降噪力度',0,100,state.denoise,'%','过度降噪可能损伤气声与辅音；先做短片段试听。')}${toggle('dereverb','轻度去混响',!!state.dereverb)}${toggle('breaths','保留呼吸与清辅音',state.breaths!==false)}<div class="pro-only advanced-block">${fieldSelect('separator','分离策略',[['auto','自动 / 按素材建议'],['roformer','RoFormer 系列'],['mdx','MDX 系列']],state.separator||'auto','具体模型、权重许可与硬件支持由执行器检查。')}<div class="parameter-row"><span>切片上下文</span><strong>由执行器声明</strong></div><div class="parameter-row"><span>接缝处理</span><strong>时间对齐 + 交叠淡化</strong></div></div><div class="helper-box orange space-top">这些参数会保存到配方；真正的分离与降噪需连接本地推理引擎。</div></div><div class="helper-box"><strong>更少处理，也是一种选择。</strong><p>如果输入已经是干净人声，可以直接跳过分离。</p></div></aside></div>${footer()}`;}
function renderPitch(){return `${header()}<div class="step-tabs"><button data-pitchtab="pitch" class="${state.pitchTab==='pitch'?'active':''}">音高与音准</button><button data-pitchtab="lyrics" class="${state.pitchTab==='lyrics'?'active':''}">歌词与音符</button><button data-pitchtab="compare" class="${state.pitchTab==='compare'?'active':''}">算法复核</button></div>${mockNote('以下曲线、歌词和音符是可编辑的示例数据；不会冒充对你导入音频的分析结果。')}${state.pitchTab==='lyrics'?renderLyrics():state.pitchTab==='compare'?renderCompare():renderPitchEditor()}${footer()}`;}
function pitchCanvasCard(){return `<div class="card"><div class="editor-toolbar"><div class="editor-tools">${[['select','选择'],['draw','画曲线'],['note','拖音符']].map(([v,l])=>`<button class="tool-button ${state.tool===v?'active':''}" data-tool="${v}">${l}</button>`).join('')}<button class="tool-button ${state.pitchLocked?'active':''}" data-act="lockPitch">${state.pitchLocked?'已锁定编辑':'锁定手动区'}</button></div><span class="editor-note">示例旋律 · C major</span></div><div class="pitch-wrap"><div class="pitch-top"><strong>主唱 · 音高曲线</strong><small>${state.pitchFixed?'已采纳演示修复':'橙色 = 示例分歧区域'}</small></div><canvas id="pitchCanvas" class="pitch-canvas" tabindex="0" aria-label="示例音高编辑器。点击或拖动音符调整音高，也可选择后使用方向键。"></canvas><div class="pitch-legend"><span><i class="legend-line"></i>目标 / 手动编辑</span><span><i class="legend-line gray"></i>原始曲线</span><span><i class="legend-line orange"></i>算法分歧</span><span class="kbd">↑ ↓ 移动音符</span></div></div><div class="segment-band">当前选区 <strong>${time(state.selection[0])} — ${time(state.selection[1])}</strong><span id="selectedNoteLabel">· 音符 ${state.selectedNote===undefined?'未选中':state.selectedNote+1}</span></div></div>`;}
function renderPitchEditor(){return `<div class="layout-split"><div class="stack">${pitchCanvasCard()}<div class="risk-card"><span class="risk-icon">${state.pitchFixed?'✓':'!'}</span><div><h3>${state.pitchFixed?'示例分歧已修复，手动编辑仍保留':'这段可能跳到了和声的音高'}</h3><p>${state.pitchFixed?'已将目标曲线恢复到示例主旋律。这是交互演示；正式版会保留各算法证据和修复前后试听。':'00:12–00:16：先独奏主唱，比较检测算法。无需整首反复转换，也不用先改训练参数。'}</p><div class="row space-top wrap"><button class="button orange small" data-act="reviewPitch">${icon('spark')}仅复核此片段</button><button class="button ghost small" data-act="listenRisk">${icon('play')}循环试听</button></div></div></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>音高检查器</strong><span class="subtle-label">NON-DESTRUCTIVE</span></div>${fieldSelect('alg','检测算法',algorithms.map(a=>[a[0],a[0]+' · '+a[1]]),state.alg)}${slider('shift','整体移调',-12,12,state.shift,' st','半音调整与音色、共振峰分别控制。')}${slider('correction','音符中心修正',0,100,state.correction,'%')}${slider('vibrato','保留颤音',0,100,state.vibrato,'%')}${toggle('snap','吸附到半音',state.snap)}<div class="row"><button class="button small" data-act="noteDown">− 半音</button><button class="button small" data-act="noteUp">+ 半音</button><button class="text-button" data-act="undo">撤销</button></div><div class="pro-only advanced-block">${slider('smoothing','缓慢漂移修正',0,100,state.smoothing,'%')}${fieldSelect('pitchRef','音准参考',[['demo','示例 C 大调旋律'],['none','无参考 · 不评分'],['midi','导入 MIDI（需正式版）']],state.pitchRef||'demo','F0 检测不等于音准评分。无旋律参考时只报告偏移与分歧。')}<div class="parameter-row"><span>清浊音</span><strong>独立掩码，空值不补成音高</strong></div></div></div><div class="helper-box"><strong>不把歌唱磨成一条直线。</strong><p>颤音、滑音、起音与音符中心分开调整。手动锁定区不会被重新检测覆盖。</p></div></aside></div>`;}
function renderLyrics(){return `<div class="layout-split"><div class="stack"><div class="highlight-strip">新歌词需要新的演唱内容。先生成或录制导唱，再用已有模型换成目标音色。</div><div class="card"><div class="card-top"><h2 class="card-title">${icon('note')}新词与原旋律对齐</h2>${badge('示例歌词')}</div><div class="table-wrap"><table class="lyrics-table"><thead><tr><th style="width:85px">时间</th><th>原词 / 新词</th><th style="width:100px">长度参考</th></tr></thead><tbody>${state.lyrics.map((line,i)=>`<tr><td>${['00:01–00:06','00:07–00:11','00:12–00:18'][i]}</td><td><div class="original-line">原词：${originalLyrics[i]}</div><input data-lyric="${i}" aria-label="第${i+1}句新歌词" maxlength="100" value="${esc(line)}"></td><td><span class="syllable ${line.replace(/\s/g,'').length!==originalLyrics[i].length?'warn':''}" id="lyricCount${i}">${lyricCount(line,i)}</span></td></tr>`).join('')}</tbody></table></div><p class="info-inline" style="margin:13px 17px">本原型只统计字符数作编辑提示；正式版需按语言与发音计算音节，并检查连音、时长和音素。</p><div class="lyric-grid"><button class="route-card ${state.lyricsRoute==='guide'?'active':''}" data-route="guide"><strong>录制 / 导入新词导唱</strong><p>已有 VC 模型即可继续。先获得唱着新词的干声。</p></button><button class="route-card ${state.lyricsRoute==='svs'?'active':''}" data-route="svs"><strong>使用歌声合成</strong><p>歌词 + 旋律 + 可用 SVS 引擎。可再接目标 VC 音色。</p></button></div></div><div class="card card-pad"><h3 class="card-title">${icon('branch')}改词后的处理路线</h3><div class="pipeline-row" style="padding:20px 0 7px"><div class="pipeline-node"><strong>新歌词</strong><small>逐句检查与发音</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>${state.lyricsRoute==='guide'?'新词导唱':'SVS 合成'}</strong><small>${state.lyricsRoute==='guide'?'录制或导入':'需要旋律与音素'}</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>目标音色</strong><small>可选 VC 转换</small></div></div></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>演唱与发音</strong><span class="subtle-label">LYRICS EDITOR</span></div>${fieldSelect('language','歌词语言',[['zh','中文 · 普通话'],['en','English'],['ja','日本語']],state.language||'zh','正式版按模型音素表检查支持范围。')}${fieldSelect('melody','旋律来源',[['reference','原曲转写后人工检查'],['midi','已有 MIDI / 乐谱'],['manual','手动编辑音符']],state.melody||'reference')}${toggle('retainTiming','保持句子起止时间',state.retainTiming!==false)}${toggle('melisma','保留一字多音',state.melisma!==false)}<div class="helper-box orange space-top"><strong>${state.lyricsRoute==='guide'?'下一步：准备新词干声':'还需要一个可用的 SVS 引擎'}</strong><p>${state.lyricsRoute==='guide'?'你的 RVC 模型可以转换新导唱。仅编辑文字不会改变原始演唱内容。':'RVC 权重不能作为 DiffSinger 声库加载。缺少合成能力时，可切换到导唱路线。'}</p></div><button class="button full space-top" data-act="lyricsPreview">${icon('play')}查看这一句的执行计划</button></div><div class="helper-box"><strong>只改这一句。</strong><p>正式版保留句子以外的音轨，仅重算必要的上下文、接缝和效果尾音。</p></div></aside></div>`;}
function lyricCount(line,i){let n=[...line.replace(/\s/g,'')].length,d=n-originalLyrics[i].length;return `${n} 字 · ${d===0?'长度一致':d>0?'多 '+d+' 字':'少 '+(-d)+' 字'}`;}
function renderCompare(){return `<div class="layout-split"><div class="stack">${pitchCanvasCard()}<div class="card card-pad"><h2 class="card-title">按片段选择合适的检测器</h2><p class="info-inline">算法分歧表示需要检查，不等于其中一个一定出错。不同算法的置信度不直接平均。</p><div class="algorithm-grid">${algorithms.map(([n,d])=>`<button class="algorithm-card ${state.alg===n?'active':''}" data-alg="${n}"><strong>${n}</strong><small>${d}</small></button>`).join('')}</div><div class="row space-top wrap"><button class="button primary small" data-act="reviewPitch">采纳此片段的演示修复</button><button class="button ghost small" data-act="resetPitch">恢复原始示例曲线</button></div></div></div><aside class="inspector stack"><div class="card card-pad"><h3 class="card-title">复核范围</h3><div class="parameter-row"><span>时间</span><strong>${time(state.selection[0])}–${time(state.selection[1])}</strong></div><div class="parameter-row"><span>当前检测器</span><strong>${esc(state.alg)}</strong></div><div class="parameter-row"><span>手动编辑</span><strong>${state.pitchLocked?'已锁定':'保留独立编辑层'}</strong></div><div class="line"></div><div class="helper-box orange">和声叠加时，不能把两条旋律的 Hz 直接平均。先选出目标声部，再比较音分差和清浊音。</div><div class="space-top info-inline">正式版提供原始 F0、目标 F0 和渲染后重测 F0 三层；本页未执行算法。</div></div></aside></div>`;}
function renderConvert(){return `${header()}${mockNote()}<div class="layout-split"><div class="stack"><div class="card"><div class="card-top"><h2 class="card-title">${icon('branch')}每个候选，都从干净源出发</h2>${badge(state.serial?'高级：串联模式':'默认：同源分支',state.serial?'orange':'neutral')}</div><div class="pipeline-row"><div class="pipeline-node"><strong>整理后的人声</strong><small>原始派生 · 可回退</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>已确认的音高</strong><small>保留手动锁定区</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>${state.serial?'前一轮 → 新模型':'模型 A / 模型 B'}</strong><small>${state.serial?'明确增加转换世代':'并列候选 · 独立参数'}</small></div></div></div><div class="version-grid">${state.versions.map(v=>`<div class="version-card ${state.selectedVersion===v.id?'selected':''}"><div class="version-top"><h3>${esc(v.label)}</h3><span class="version-number">${esc(v.id.toUpperCase())}</span></div><p>${modelNames[v.model]||esc(v.model)} · ${esc(v.alg)}<br>${v.source==='clean'?'从干净人声生成':'显式串联生成'} · 模型推理演示</p><div class="chip-row"><span class="chip">移调 ${v.shift>0?'+':''}${v.shift} st</span><span class="chip">检索 ${v.indexRate}%</span></div><div class="version-actions space-top"><button class="button small ${state.selectedVersion===v.id?'primary':''}" data-version="${v.id}">${state.selectedVersion===v.id?'已选候选':'选为候选'}</button><button class="button ghost small" data-preview="${v.id}">${icon('play')}试听说明</button></div></div>`).join('')}</div><div class="card card-pad"><div class="flex-between"><h2 class="card-title">${icon('spark')}先做一次短片段实验</h2><span class="engine-label">PREVIEW FIRST</span></div><p class="info-inline">选择高音、气声或多声部重叠的困难片段。满意后再渲染整首。原型会演示队列与候选管理，不运行模型。</p><div class="row wrap"><button class="button primary" data-act="runCandidate">${icon('spark')}生成选区候选 · 演示</button><button class="button ghost" data-act="runFull">整曲任务 · 演示</button><button class="text-button" data-panel="queue">查看队列</button></div></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>声音转换设置</strong><span class="subtle-label">RVC ADAPTER</span></div>${fieldSelect('model','当前目标模型',[['clear','清澈 · 女声 / RVC'],['warm','温暖 · 男声 / RVC'],['air','空灵 · 参考音色 / 可选引擎']],state.model)}${slider('indexRate','检索特征比例',0,100,state.indexRate,'%','正式版仅在匹配索引存在时启用；缺索引时明确提示。')}${slider('protect','清辅音保护',0,50,state.protect,'%')}${slider('shift','整体移调',-12,12,state.shift,' st')}<div class="pro-only advanced-block">${slider('formant','共振峰调整',-12,12,state.formant,' st','依执行器支持；不支持时禁用且解释原因。')}${toggle('serial','显式串联多轮',state.serial,'会把前一轮输出送入下一轮，失真可能累积。')}<button class="button full small" data-act="tuning">参数实验与模型调优</button></div><div class="helper-box space-top">所有模型卡为演示配置。已有训练模型的正式版流程是导入并校验，无需重新训练。</div></div><div class="helper-box"><strong>A/B 要公平。</strong><p>正式版在同一时间选区内做等响度试听；原型的 B 是合成示例的滤波对照。</p></div></aside></div>${footer()}`;}
function renderMix(){return `${header()}${mockNote('示例分轨的音量、静音与独奏可真实试听；EQ、压缩、混响等面板保存配方，尚未实现处理。')}<div class="layout-split"><div class="stack"><div class="card"><div class="card-top"><h2 class="card-title">${icon('sliders')}混音台</h2>${badge(state.source.kind==='demo'?'合成分轨可试听':'仅原始音轨可试听',state.source.kind==='demo'?'neutral':'orange')}</div><div class="mixer">${(state.source.kind==='demo'?[['lead','主唱',''],['harmony','和声','purple'],['music','伴奏','blue'],['master','总线','orange']]:[['source','原始音轨',''],['master','总线','orange']]).map(([key,n,c])=>`<div class="channel"><div class="channel-name"><span class="channel-dot ${c}"></span>${n}</div><div class="channel-controls"><input type="range" class="fader" min="-30" max="6" step=".5" value="${state.mix[key]}" data-mix="${key}" aria-label="${n}音量"><div class="level-meter" aria-hidden="true"></div></div><div class="channel-level" id="mixLabel${key}">${state.mix[key]>0?'+':''}${state.mix[key].toFixed(1)} dB</div><div class="channel-buttons"><button data-mute="${key}" class="${state.mute[key]?'active':''}" aria-label="${n}静音">M</button>${key!=='master'?`<button data-solo="${key}" class="${state.solo===key?'active':''}" aria-label="${n}独奏">S</button>`:''}</div></div>`).join('')}</div><div class="segment-band">电平条仅作布局示意 · 不显示未经测量的 LUFS / 真峰值</div></div><div class="card card-pad"><div class="flex-between"><h2 class="card-title">后期效果链</h2><span class="engine-label">RECIPE ONLY</span></div><div class="pipeline-row" style="padding:16px 0 5px"><div class="pipeline-node"><strong>EQ / 去齿音</strong><small>按需要修整</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>轻压缩</strong><small>保留动态</small></div><span class="pipeline-arrow">→</span><div class="pipeline-node"><strong>空间 / 限幅</strong><small>同一空间融合</small></div></div><p class="info-inline">改变混音无需重新分离或换声。效果尾音属于重渲染范围，正式版会自动纳入。</p></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>主唱效果</strong><span class="subtle-label">POST PROCESSING</span></div>${[['eq','轻度均衡'],['deess','去齿音'],['compress','人声压缩'],['reverb','空间混响'],['limiter','总线峰值限制']].map(([k,l])=>toggle('post.'+k,l,state.post[k])).join('')}<div class="line"></div>${slider('reverb','混响发送量',0,50,state.reverb,'%')}<div class="helper-box orange">效果开关用于检查交互与保存配方；本页可听到的真实处理只有音量和静音/独奏。</div></div><div class="helper-box"><strong>先把人声听清楚。</strong><p>听完整曲也听孤立主唱。导出前再检查接缝、齿音、音高和响度。</p></div></aside></div>${footer()}`;}
function renderExport(){return `${header()}<div class="layout-split"><div class="stack"><div class="card card-pad"><h2 class="card-title">${icon('out')}选择交付格式</h2><p class="info-inline">此处为正式版导出配方；原型实际导出能力在下方明确列出。</p><div class="export-grid">${[['wav','WAV','无损制作 / 母带'],['flac','FLAC','无损归档'],['mp3','MP3','分享试听']].map(([k,n,d])=>`<button class="export-card ${state.format===k?'active':''}" data-format="${k}">${icon('wave')}<strong>${n}</strong><small>${d}</small></button>`).join('')}</div><div class="field-grid space-top">${fieldSelect('exportRate','采样率',[['44100','44.1 kHz'],['48000','48 kHz'],['96000','96 kHz']],state.exportRate)}${fieldSelect('bitDepth','位深 / 编码',[['16','16 bit PCM'],['24','24 bit PCM'],['32','32 bit float']],state.bitDepth)}</div>${toggle('exportStems','同时导出分轨',state.exportStems)}${toggle('exportRecipe','同时保存工程配方',state.exportRecipe)}</div><div class="card card-pad"><h2 class="card-title">原型现在可以导出什么？</h2><p class="info-inline">真实导出浏览器中的原始音频或合成示例，可应用裁剪与总线增益。输出为当前解码采样率、16 bit PCM WAV，不包含 AI 转换和未实现的后期效果。</p>${fieldSelect('exportRange','实际 WAV 导出范围',[['all','整段音频'],['selection','仅当前选区']],state.exportRange)}<div class="row wrap"><button class="button primary" data-act="exportWav">${icon('out')}导出原声 / 示例 WAV</button><button class="button ghost" data-act="saveRecipe">${icon('save')}下载制作配方 JSON</button></div></div><div class="helper-box orange"><strong>AI 成品尚未生成。</strong><p>正式版只有模型实际推理并通过产物检查后，才会出现“导出转换成品”。不会把原音频复制后标为变声成功。</p></div></div><aside class="inspector stack"><div class="card card-pad"><div class="inspector-heading"><strong>交付前检查</strong><span class="subtle-label">FINAL PASS</span></div><div class="check-list">${[['listen','已经完整听过一遍'],['words','歌词 / 发音已检查'],['pitch','音高 / 颤音已检查'],['seam','切片和模型接缝已检查'],['level','峰值与响度已测量']].map(([k,t])=>`<label><input type="checkbox" data-check="${k}" ${state.checks?.[k]?'checked':''}>${t}</label>`).join('')}</div><div class="line"></div><div class="parameter-row"><span>当前来源</span><strong>${state.source.kind==='demo'?'合成示例':'本地原音频'}</strong></div><div class="parameter-row"><span>AI 引擎</span><strong>未连接</strong></div><div class="parameter-row"><span>候选</span><strong>仅演示配置</strong></div><div class="parameter-row"><span>配方版本</span><strong>schema v1</strong></div><button class="button full space-top" data-act="importRecipe">${icon('in')}恢复已有配方</button></div><div class="helper-box"><strong>可以重新打开的作品。</strong><p>配方记录选区、模型选择、音高编辑、歌词和混音。原始文件需另行保留并重新链接。</p></div></aside></div>${footer()}`;}

document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='wave'){let r=drag.canvas.getBoundingClientRect(),t=clamp((e.clientX-r.left)/r.width,0,1)*state.source.duration;state.selection=[Math.min(drag.start,t),Math.max(drag.start,t)];drawWaves();}else updatePitchPointer(e);});
document.addEventListener('pointerup',()=>{if(!drag)return;let type=drag.type;drag=null;if(type==='wave'){state.selection=normalizeSelection(state.selection,state.source.duration);if($('#selectionText'))$('#selectionText').textContent=time(state.selection[0])+' — '+time(state.selection[1]);if($('#trimStart'))$('#trimStart').value=state.selection[0].toFixed(1);if($('#trimEnd'))$('#trimEnd').value=state.selection[1].toFixed(1);}else render();});
$('#playButton').addEventListener('click',playAudio);$('#startButton').addEventListener('click',()=>{let was=isPlaying;stopAudio();offset=state.loop?state.selection[0]:0;updatePlayer();if(was)playAudio();});$('#loopButton').addEventListener('click',()=>{state.loop=!state.loop;updatePlayer();toast(state.loop?'循环已开启：当前时间选区。':'循环已关闭。');});$('#seek').addEventListener('input',e=>{const was=isPlaying;stopAudio();offset=Number(e.target.value);updatePlayer();if(was)playAudio();});$('#masterVolume').addEventListener('input',applyGains);$('#listenOriginal').addEventListener('click',()=>switchListen('A'));$('#listenCandidate').addEventListener('click',()=>switchListen('B'));$('#audioInput').addEventListener('change',e=>{loadAudio(e.target.files[0]);e.target.value='';});$('#recipeInput').addEventListener('change',e=>{if(e.target.files[0])importRecipe(e.target.files[0]);e.target.value='';});$('#aboutButton').addEventListener('click',about);$('#saveButton').addEventListener('click',saveRecipe);$('#undoButton').addEventListener('click',undo);$('#projectPicker').addEventListener('click',()=>openModal('工程与素材','<p>工程配方保存任务选择、编辑参数、歌词、模型候选与时间选区。原始音频在本机内存中，不会上传，也不会随网页自动保存。</p><p>可导出配方后重新打开，或继续导入一条原始音频开始制作。</p>','<button class="button" data-act="saveRecipe">保存配方</button><button class="button" data-act="importRecipe">导入配方</button>'));document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#modal').open)return;if(e.code==='Space'){e.preventDefault();playAudio();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}if(state.step===2&&state.pitchTab==='pitch'&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();adjustNote(e.key==='ArrowUp'?1:-1);}});window.addEventListener('resize',()=>{drawWaves();drawPitch();});
render();

</script>
</body>
</html>
